<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pole</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>

<body>
    <!-- Ici le menu sera injecté -->
    <div id="menu-placeholder"></div>

    <div class="nav-overlay" id="navOverlay"></div>

     <!-- PAGE : Pole -->
    <section class="gallery">
        <div class="container">
            <h2>Pole</h2>
            <section id="gallery-sections" class="sections-grid">
                <a href="/pole/part.html" class="section-card">
                    <h3>Part</h3>
                </a>

                <a href="/pole/pcs.html" class="section-card">
                    <h3>PCS</h3>
                </a>

                <a href="/pole/sciences.html" class="section-card">
                    <h3>Sciences</h3>
                </a>
            </section>
        </div>
    </section>

    <!-- LIGHTBOX -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-img" src="" alt="">
        <a class="lightbox-download-btn" href="" download>⬇ Télécharger</a>
    </div>

    <!-- Script principal -->
    <script src="../../assets/js/app.js"></script>

    <!-- Script pour charger le menu -->
    <script>
    fetch("/menu.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("menu-placeholder").innerHTML = data;
        // Charger la logique du menu une fois injecté
        const script = document.createElement("script");
        script.src = "/assets/js/menu.js";
        document.body.appendChild(script);
      });
    </script>
</body>
</html>
