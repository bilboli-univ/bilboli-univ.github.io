<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FindMeOnPhoto</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <!-- Ici le menu sera injecté -->
  <div id="menu-placeholder"></div>

    <div class="nav-overlay" id="navOverlay"></div>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
        <h1 class="hero-title">Partenariat</h1>
        </div>
    </section>

    <!-- Lightbox overlay -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-img" src="" alt="">
        <a class="lightbox-download-btn" href="" download>⬇ Télécharger</a>
    </div>

    <!-- Load Java -->
    <script src="/assets/js/app.js"></script>

    <!-- Script pour charger le menu -->
    <script>
    fetch("/menu.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("menu-placeholder").innerHTML = data;
        // Charger la logique du menu une fois injecté
        const script = document.createElement("script");
        script.src = "/assets/js/menu.js";
        document.body.appendChild(script);
      });
    </script>
</body>
</html>
