<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <!-- Ici le menu sera injecté -->
  <div id="menu-placeholder"></div>

    <div class="nav-overlay" id="navOverlay"></div>


  <main class="container profile-page">
    <section class="profile">
      <div class="profile-header" style="display:flex;gap:1rem;align-items:center">
        <img id="profileAvatar" src="assets/img/logo.png" alt="Avatar" style="width:80px;height:80px;border-radius:50%;object-fit:cover">
        <div>
          <h2 id="profileName">Nom d'Utilisateur</h2>
          <div id="profileEmail">user@example.com</div>
        </div>
        <div style="margin-left:auto">
          <button id="editProfileBtn" class="btn">Éditer le Profil</button>
        </div>
      </div>

      <h3 style="margin-top:1.2rem">Photos de référence</h3>

      <div id="photoGallery" class="photo-gallery"></div>

      <div style="margin-top:1rem;">
        <button id="addPhotoBtn" class="btn">Ajouter une photo</button>
      </div>
    </section>
  </main>

  <script src="assets/js/profile.js"></script>

   <script>
    const burgerBtn = document.getElementById("burgerBtn");
    const navMenu = document.getElementById("navMenu");
    const overlay = document.getElementById("navOverlay");

    burgerBtn.addEventListener("click", () => {
      navMenu.classList.toggle("open");
      overlay.classList.toggle("show");
    });

    overlay.addEventListener("click", () => {
      navMenu.classList.remove("open");
      overlay.classList.remove("show");
    });
    </script>

    <!-- Script pour charger le menu -->
    <script>
    fetch("menu.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("menu-placeholder").innerHTML = data;
        // Charger la logique du menu une fois injecté
        const script = document.createElement("script");
        script.src = "/assets/js/menu.js";
        document.body.appendChild(script);
      });
    </script>
</body>
</html>
