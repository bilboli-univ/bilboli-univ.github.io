<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Danse</title>
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      
      <!-- Logo -->
      <a class="logo" href="../../index.html">
        <img src="../../assets/img/logo.png" alt="Logo">
      </a>

      <!-- Bouton burger (mobile) -->
      <button class="burger-btn" id="burgerBtn">☰</button>

      <!-- Menu principal (utilisé sur desktop ET mobile) -->
      <nav class="main-nav" id="navMenu">
        <ul>
          <li><a href="../../galerie.html">Galerie</a></li>
          <li><a href="#">Work in progress </a></li>
          <li><a href="#">Work in progress </a></li>
          <li><a href="#">Work in progress </a></li>
          <li><a href="#">Work in progress </a></li>
          <li><a href="../../profile.html">Profile</a></li>
        </ul>
      </nav>

    </div>
  </header>

  <div class="nav-overlay" id="navOverlay"></div>

  <!-- PAGE Piscine -->
  <section id="danse" class="page active">
    <div class="container">
      <h2>Photos - Piscine</h2>
      <div class="photo-grid"></div>
    </div>
  </section>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox">
      <span class="lightbox-close">&times;</span>
      <img class="lightbox-img" src="" alt="">
      <a class="lightbox-download-btn" href="" download>📥 Télécharger</a>
  </div>

  <!-- SCRIPT Piscine -->
  <script src="../../assets/js/danse.js"></script>

  <!-- SCRIPT MENU BURGER -->
  <script>
    const burgerBtn = document.getElementById("burgerBtn");
    const navMenu = document.getElementById("navMenu");
    const overlay = document.getElementById("navOverlay");

    burgerBtn.addEventListener("click", () => {
      navMenu.classList.toggle("open");
      overlay.classList.toggle("show");
    });

    overlay.addEventListener("click", () => {
      navMenu.classList.remove("open");
      overlay.classList.remove("show");
    });
  </script>

</body>
</html>
