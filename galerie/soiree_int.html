<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Soirée inté</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>

<body>
  <!-- Ici le menu sera injecté -->
  <div id="menu-placeholder"></div>

  <div class="nav-overlay" id="navOverlay"></div>

  <!-- PAGE : inté -->
  <section id="soiree_int" class="page.active">
    <div class="container">
        <h2>Photos -Soirée s'intégration</h2>
        <div class="photo-grid"></div>
    </div>
  </section>

    <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox">
      <span class="lightbox-close">&times;</span>
      <img class="lightbox-img" src="" alt="">
      <a class="lightbox-download-btn" href="" download>📥 Télécharger</a>
  </div>

  <!-- SCRIPT WEI -->
  <script src="../assets/js/soiree_int.js"></script>

  <!-- Script pour charger le menu -->
  <script>
  fetch("../menu.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("menu-placeholder").innerHTML = data;
      // Charger la logique du menu une fois injecté
      const script = document.createElement("script");
      script.src = "/assets/js/menu.js";
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
