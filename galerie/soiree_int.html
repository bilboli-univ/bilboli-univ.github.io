<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Soirée inté</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>

<body>
  <div id="loader">
    <div class="spinner"></div>
    <p>Chargement...</p>
  </div>
  <!-- Ici le menu sera injecté -->
  <div id="menu-placeholder"></div>

  <div class="nav-overlay" id="navOverlay"></div>

  <!-- PAGE : inté -->
  <section id="soiree_int" class="page.active">
    <div class="container">
        <h2>Photos -Soirée s'intégration</h2>
        <div class="photo-grid"></div>
    </div>
  </section>

    <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox">
      <span class="lightbox-close">&times;</span>
      <img class="lightbox-img" src="" alt="">
      <div class="lightbox-buttons">
        <a class="lightbox-download-btn" href="" download>📥 Télécharger</a>
        <button class="lightbox-report-btn" onclick="openReportModal()">🚩 Signaler</button>
</div>

  </div>

  <!-- SCRIPT WEI -->
  <script src="../assets/js/soiree_int.js"></script>

  <!-- Script pour charger le menu -->
  <script>
  fetch("../menu.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("menu-placeholder").innerHTML = data;
      // Charger la logique du menu une fois injecté
      const script = document.createElement("script");
      script.src = "/assets/js/menu.js";
      document.body.appendChild(script);
    });
  </script>
  <!-- ✅ Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>


  <!-- ✅ Config + Auth -->
  <script src="/assets/js/firebase-config.js"></script>
  <script src="/assets/js/auth.js"></script>
  

  <!-- ✅ Protection de la page -->
  <script src="/assets/js/protect.js"></script>
  <script src="/assets/js/report.js"></script>

  <div id="reportModal" class="modal hidden">
    <div class="modal-content">
      <h3>Signaler une photo</h3>
      <p>Explique brièvement pourquoi cette photo doit être signalée :</p>

      <textarea id="reportReason" placeholder="Raison du signalement..."></textarea>

      <button onclick="submitReport()">Envoyer</button>
      <button onclick="closeReportModal()">Annuler</button>
    </div>
  </div>
</body>
</html>
